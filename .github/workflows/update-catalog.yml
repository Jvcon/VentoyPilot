name: Update Catalog

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate catalog.json from endoflife.date + sources
        run: cargo run --bin catalog-gen

      - name: Show diff
        run: |
          git diff --stat catalog.json
          git diff catalog.json | head -100 || true

      - name: Commit if changed
        run: |
          if ! git diff --quiet catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "chore: update catalog $(date -u +%Y-%m-%d)"
            git push
          else
            echo "catalog.json unchanged"
          fi
